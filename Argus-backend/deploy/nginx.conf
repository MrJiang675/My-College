# 站点配置：由 nginx.conf 的 http 块通过 conf.d/*.conf 引入。
server {
    listen 80;
    server_name _;

    # 将 root 调整为服务器上实际的前端构建目录。
    root /srv/argus/Argus-frontend/dist;
    index index.html;

    # 为 multipart 边界和表单字段预留空间，后端仍独立执行上传限制。
    client_max_body_size 60m;

    location /api/ {
        # 不附加 URI，保留 /api/ 前缀；关闭缓冲以便流式返回回答。
        proxy_pass http://localhost:10001;
        proxy_http_version 1.1;
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 120s;  # 相邻两次上游读取之间的最长等待时间
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # 静态文件优先，history 路由刷新时交给 Vue Router。
        try_files $uri $uri/ /index.html;
    }
}

