services:
  postgres:
    image: pgvector/pgvector:pg16
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-320m}
    command: postgres -c shared_buffers=64MB -c work_mem=4MB -c max_connections=40
    container_name: argus-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argus_rag}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-set-real-password-via-env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-argus_rag}"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    profiles: ["es"]
    mem_limit: ${ES_MEMORY_LIMIT:-420m}
    build:
      context: .
      dockerfile: images/elasticsearch/Dockerfile
    container_name: argus-rag-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms192m -Xmx256m}
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  minio:
    mem_limit: ${MINIO_MEMORY_LIMIT:-192m}
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: argus-rag-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-set-real-key-via-env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-set-real-password-via-env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticvue:
    profiles: ["es-tools"]
    mem_limit: 96m
    image: cars10/elasticvue:latest
    container_name: argus-rag-elasticvue
    restart: unless-stopped
    ports:
      - "${ELASTICVUE_PORT:-8088}:8080"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  postgres-data:
  elasticsearch-data:
  minio-data:
