services:
  ollama:
    profiles: ["local-model"]
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-768m}
    image: ollama/ollama:latest
    container_name: argus-rag-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama-model-init:
    profiles: ["local-model"]
    mem_limit: 128m
    image: ollama/ollama:latest
    container_name: argus-rag-ollama-model-init
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo "Waiting for Ollama service..."
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done
        echo "Pulling model ${OLLAMA_EMBEDDING_MODEL:-qllama/bge-small-zh-v1.5}..."
        ollama pull ${OLLAMA_EMBEDDING_MODEL:-qllama/bge-small-zh-v1.5}
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  backend:
    image: eclipse-temurin:21-jre
    mem_limit: ${BACKEND_MEMORY_LIMIT:-600m}
    container_name: argus-rag-backend
    restart: unless-stopped
    working_dir: /workspace/Argus-backend
    command: >
      java -jar target/Argus-backend-0.0.1-SNAPSHOT.jar
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_INTERNAL_PORT:-5432}/${POSTGRES_DB:-argus_rag}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-set-real-password-via-env}
      STORAGE_MINIO_ENDPOINT: http://${MINIO_HOST}:${MINIO_INTERNAL_PORT:-9000}
      STORAGE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-set-real-key-via-env}
      STORAGE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-set-real-password-via-env}
      STORAGE_MINIO_BUCKET: ${MINIO_BUCKET:-argus-rag-documents}
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST}
      ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT:-9200}
      ELASTICSEARCH_SCHEME: ${ELASTICSEARCH_SCHEME:-http}
      ARGUS_RAG_JWT_SECRET: ${ARGUS_RAG_JWT_SECRET}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms192m -Xmx384m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC}
      ARGUS_ELASTICSEARCH_ENABLED: ${ARGUS_ELASTICSEARCH_ENABLED:-false}
      ZHIPUAI_API_KEY: ${ZHIPUAI_API_KEY}
      SERVER_PORT: 8080
      ARGUS_RAG_CORS_ALLOWED_ORIGINS: ${ARGUS_RAG_CORS_ALLOWED_ORIGINS}
      ARGUS_MAX_UPLOAD_SIZE_MB: ${ARGUS_MAX_UPLOAD_SIZE_MB:-50}
    ports:
      - "${BACKEND_PORT:-18080}:8080"
    volumes:
      - ../..:/workspace
      - maven-repo:/root/.m2
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  frontend:
    image: node:22-alpine
    container_name: argus-rag-frontend
    restart: unless-stopped
    working_dir: /workspace/Argus-frontend
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_DEV_PROXY_TARGET: ${VITE_DEV_PROXY_TARGET:-http://backend:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../..:/workspace
      - frontend-node-modules:/workspace/Argus-frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ollama-data:
  maven-repo:
  frontend-node-modules:
