project:
  name: Argus-backend
  version: 1.0.0

server:
  port: 10001

spring:
#  autoconfigure:
#    exclude:
#        - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
#        - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
#        - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
#        - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
#        - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
#        - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
#        - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration

  application:
    name: argus-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:argus_rag}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:set-real-password-via-env}
    driver-class-name: org.postgresql.Driver

  # ──────────────────────────────────────────────
  # Spring AI Alibaba — DashScope 原生配置
  # ──────────────────────────────────────────────
  ai:
#    model:
#      chat: openai
#      embedding: openai
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-dummy-key-for-startup}
    zhipuai:
      # 真实 key 通过环境变量 ZHIPUAI_API_KEY 注入，不写入仓库
      api-key: ${ZHIPUAI_API_KEY:set-real-key-via-env}
#      base-url: ${OPENAI_BASE_URL:https://open.bigmodel.cn/api/paas/v4/}
      chat:
        options:
          model: glm-4-flash
      #openai:
      #api-key: ${OPENAI_API_KEY:your-openai-compatible-api-key}
      #base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      embedding:
        options:
          # 指定维度，确保与数据库表结构一致
          dimensions: 1024
          model: embedding-2
          # 单个输入超过模型 context length 时由 Ollama 截断，避免上传链路直接失败。
          truncate: true

    # 下面是 Ollama 相关配置，使用的话需要自己部署ollama对应的向量模型，然后放开spring-ai-starter-model-ollama，注释掉spring-ai-starter-model-openai
    #    model:
    #      chat: dashscope
    #      embedding: ollama
    #    dashscope:
    #      api-key: ${DASHSCOPE_API_KEY:}
    #      chat:
    #        options:
    #          model: glm-5
    #    ollama:
    #      base-url: http://localhost:11434
    #      embedding:
    #        options:
    #          model: qllama/bge-small-zh-v1.5
    #          # 单个输入超过模型 context length 时由 Ollama 截断，避免上传链路直接失败。
    #          truncate: true



    # PGvector 向量存储（复用已有 PostgreSQL）
    vectorstore:
      pgvector:
        dimensions: 1024
        index-type: hnsw
        distance-type: cosine_distance

  servlet:
    multipart:
      file-size-threshold: 0B
      max-file-size: ${ARGUS_MAX_UPLOAD_SIZE_MB:50}MB
      max-request-size: ${ARGUS_MAX_REQUEST_SIZE_MB:60}MB


storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:set-real-key-via-env}
    secret-key: ${MINIO_SECRET_KEY:set-real-key-via-env}
    bucket: ${MINIO_BUCKET:argus-rag-documents}

argus:
  rag:
    auth:
      demo-guest-enabled: ${ARGUS_DEMO_GUEST_ENABLED:true}
      jwt-secret: ${ARGUS_RAG_JWT_SECRET:set-real-jwt-secret-via-env-minimum-32-bytes}
      issuer: argus-rag
      access-token-expire-minutes: 30
      refresh-token-expire-days: 14
      # 仅开发环境兜底，生产环境仍应显式配置安全密钥。
      #    jwt-secret: ${ARGUS_RAG_JWT_SECRET:set-real-jwt-secret-via-env-minimum-32-bytes}
      refresh-cookie-name: ARGUS_RAG_REFRESH_TOKEN
      # 本地 HTTP 使用 Lax；跨站 HTTPS 部署须同时指定 None 与 Secure=true。
      refresh-cookie-same-site: ${ARGUS_RAG_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
      refresh-cookie-secure: ${ARGUS_RAG_AUTH_REFRESH_COOKIE_SECURE:false}
    dev-admin:
      username: ${ARGUS_RAG_DEV_ADMIN_USERNAME:argus_admin}
      email: ${ARGUS_RAG_DEV_ADMIN_EMAIL:test@test.com}
      display-name: ${ARGUS_RAG_DEV_ADMIN_DISPLAY_NAME:Bruce}
      password: ${ARGUS_RAG_DEV_ADMIN_PASSWORD:set-real-password-via-env}
      user-code: ${ARGUS_RAG_DEV_ADMIN_USER_CODE:ROOT001}

elasticsearch:
  host: ${ES_HOST:127.0.0.1}
  port: ${ES_PORT:9200}
  scheme: ${ES_SCHEME:http}
  index-name: argus_rag_document_chunks

ingestion:
  chunking:
    target-tokens: 240
    max-tokens: 320
    overlap-tokens: 32
  vector:
    # 控制业务侧每次调用 VectorStore.add 的 chunk 数量，降低单次 Ollama embedding 请求压力。
    add-batch-size: 9

youcom:
  search:
    enabled: false
    api-key: ${YOUCOM_API_KEY:}
    top-k: 10
