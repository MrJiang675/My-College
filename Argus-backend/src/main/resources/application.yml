spring:
  ai:
    model:
      chat: openai
      embedding: zhipuai
    openai:
      api-key: ${DEEPSEEK_API_KEY:test-key}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      embedding:
        enabled: false
      chat:
        enabled: true
        completions-path: /chat/completions
        options:
          model: ${DEEPSEEK_CHAT_MODEL:deepseek-flash}
          temperature: 0.3
          extra-body:
            thinking:
              type: disabled
    zhipuai:
      chat:
        enabled: false
      embedding:
        enabled: true
    dashscope:
      chat:
        enabled: false
      embedding:
        enabled: false
  profiles:
    active: dev
  servlet:
    multipart:
      file-size-threshold: 0B
      max-file-size: ${ARGUS_MAX_UPLOAD_SIZE_MB:50}MB
      max-request-size: ${ARGUS_MAX_REQUEST_SIZE_MB:60}MB

# ──────────────────────────────────────────────
# MyBatis-Plus 配置
# ──────────────────────────────────────────────
mybatis-plus:
  # Mapper XML 文件扫描路径
  # classpath*: 支持从多个 jar/模块中加载（多模块项目安全写法）
  # /mappers/**/*.xml 递归匹配所有子目录下的 XML 映射文件
  # 当前匹配：mappers/、mappers/document/、mappers/ingestion/ 共 8 个文件
  mapper-locations: classpath*:/mappers/**/*.xml

  # 实体类别名包扫描路径
  # 注册后可在 XML 中直接使用类名（如 UserEntity）而无需写全限定名
  # 扫描 com.argus.rag 包下所有类（含子包），覆盖各模块的 entity 类
  type-aliases-package: com.argus.rag

  configuration:
    # 开启下划线到驼峰的自动映射
    # 数据库字段 user_name → Java 属性 userName，无需逐字段配置 @TableField
    map-underscore-to-camel-case: true

    # 默认枚举类型处理器
    # EnumTypeHandler：使用枚举的 name()（字符串）存储到数据库
    # 对比 EnumOrdinalTypeHandler（按序号存储，枚举顺序变化会导致数据错乱）
    # 当前项目所有枚举均为简单枚举（无 @EnumValue），按 name 存储最安全
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler


argus:
  # 对话/视觉/仿真共用 DeepSeek；智谱只保留 1024 维 embedding，不迁移已有向量。
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_CHAT_MODEL:deepseek-flash}
    vision-model: ${DEEPSEEK_VISION_MODEL:deepseek-flash}
    simulation-model: ${DEEPSEEK_SIMULATION_MODEL:deepseek-flash}
    simulation-thinking-level: ${DEEPSEEK_SIMULATION_THINKING_LEVEL:low}
    connect-timeout-seconds: ${DEEPSEEK_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${DEEPSEEK_READ_TIMEOUT_SECONDS:90}
    simulation-max-tokens: ${DEEPSEEK_SIMULATION_MAX_TOKENS:8192}
    simulation-max-concurrent: ${DEEPSEEK_SIMULATION_MAX_CONCURRENT:3}
  rag:
    cors:
      # 开发仅放行本地前端；生产必须通过环境变量指定准确的 Sites Origin。
      allowed-origins: ${ARGUS_RAG_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Resource limits shared by direct and chunked uploads.
argus.upload.max-size-mb: ${ARGUS_MAX_UPLOAD_SIZE_MB:50}
argus.retrieval.elasticsearch-enabled: ${ARGUS_ELASTICSEARCH_ENABLED:true}

# 云端识图；不运行本地 OCR，图片不写入工作台 JSON。
argus.vision.model: ${DEEPSEEK_VISION_MODEL:deepseek-flash}
argus.vision.max-image-mb: ${ARGUS_VISION_MAX_IMAGE_MB:5}
argus.vision.timeout-seconds: ${ARGUS_VISION_TIMEOUT_SECONDS:30}
